name: Merge contributions

on:
  push:
    branches: [main]
    paths: ['contributions/**', 'seed/**', 'engine.js', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild player data
        run: node scripts/merge.js
      - name: Commit updated data
        run: |
          git config user.name "scouting-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/base.json data/ids.json
          git diff --cached --quiet || git commit -m "Update player data from contributions"
          git push
